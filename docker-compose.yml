version: '3.8'

services:
  ad-creative-validator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ad-creative-validator
    restart: always
    ports:
      # This Mac only; publish on all interfaces only when it is meant to be reachable
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
    volumes:
      - feedback_data:/app/backend/data

volumes:
  feedback_data:
