name: ACV Weekly Official Spec Audit & Verification

on:
  schedule:
    # Run every Friday at 10:00 UTC (19:00 KST / 매주 금요일 저녁 7시)
    - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update publisher snapshot baseline'
        required: false
        default: false
        type: boolean

jobs:
  audit-and-verify:
    name: Weekly Friday Spec Audit & Zero-Regression Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Full Specification Audit & Regression Suite
        run: |
          python scripts/weekly_audit.py

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Check for Publisher Changes
        id: check_changes
        run: |
          CHANGES_COUNT=$(python -c "import json, os; print(json.load(open('backend/data/detected_changes.json')).get('changes_count', 0) if os.path.exists('backend/data/detected_changes.json') else 0)")
          echo "changes_count=$CHANGES_COUNT" >> $GITHUB_OUTPUT
          if [ "$CHANGES_COUNT" -gt 0 ]; then
            echo "🚨 Changes detected in $CHANGES_COUNT publisher guidelines!"
          else
            echo "✅ All 32 publisher specifications match live web baseline."
          fi

      - name: Create Alert Issue if Publisher Guidelines Changed
        if: steps.check_changes.outputs.changes_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('backend/data/detected_changes.json', 'utf8'));
            let body = `## 🚨 [정기 금요일 감사] 공식 매체사 광고 가이드 변동 감지 알림\n\n`;
            body += `ACV 매체 공식 가이드 모니터링 엔진이 **${data.changes_count}개 매체**의 가이드라인 웹페이지 변경을 감지했습니다.\n\n`;
            body += `### 📋 변경 감지 매체 목록\n`;
            data.changes.forEach(c => {
              body += `- **${c.name}**\n  - 공식 가이드 URL: ${c.url}\n  - 감지 시각: ${c.detected_at}\n`;
            });
            body += `\n---\n*담당자는 해당 매체의 규격(해상도, 용량, 허용 확장자, 세이프존 등) 변경 여부를 확인한 후 규격 YAML을 업데이트해주세요.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[가이드 변경 감지] ${data.changes_count}개 매체 공식 가이드라인 개정 감지 (금요 정기 감사)`,
              body: body,
              labels: ['spec-update', 'automated', 'weekly-audit']
            });
